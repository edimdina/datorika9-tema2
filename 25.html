<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mana spēle</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #8688e6; color: #000000; }
button { background-color: #532491; color: white; border: 0; border-radius: 8px; }
</style>
</head>
<body>
<h1>Galaktikas pētnieks</h1>
<p>Savieno vienādos objektus tos ķerot
Pēc katra jaunā objekta atklāšanas izlasi teoriju par to
Spēle beidzas, kad tiek līdz pēdējam objektam
Spēlētājs zaudē, ja nenoķer objektu vai noķer nepareizo objektu (kuru kosmanauts netur)</p>
<img src="atteli/varonis.png" alt="Kosmanauts" width="128">
<p>Uzvaras skaņa:</p>
<audio controls src="skanas/Cha-Ching_Sound_Effect.wav"></audio>
<p id="punkti">Punkti: 0</p>
<button onclick="savakt()">Noķert objektu</button>
<script>
// Gatava poga. Šajā tēmā mācies noformēt lapu un sakārtot failus.
let punkti = 0;
function savakt() {
  punkti = punkti + 1;
  document.getElementById("punkti").textContent = "Punkti: " + punkti;
}
</script>
</body>
</html>
