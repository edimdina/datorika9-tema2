<!DOCTYPE html>
<html lang="lv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Galaktikas pētnieks</title>
<style>
body { font-family: Arial, sans-serif; max-width: 680px; margin: 24px auto; padding: 16px; line-height: 1.6; }
button, input { font: inherit; padding: 10px; margin: 4px; }
button { cursor: pointer; }
img { max-width: 100%; height: auto; }
[hidden] { display: none !important; }
body { background-color: #f1f5f9; color: #222222; }
h1 { color: #35186b; }
.noteikumi { background-color: #4e1b6b; padding: 12px; border-radius: 12px; }
button { background-color: #0b2744; color: #f7f2f2; border: 0; }
</style>
</head>
<body>
<h1>Galaktikas pētnieks</h1>
<section class="noteikumi">
  <h2>Noteikumi</h2>
<ul>
  <li>Savieno vienādos objektus tos ķerot</li>
  <li>Pēc katra jaunā objekta atklāšanas izlasi teoriju par to</li>
  <li>Spēle beidzas, kad tiek līdz pēdējam objektam</li>
  <li>Spēlētājs zaudē. ja nenoķer objektu</li>
</ul>
</section>
<button>Sākt spēli</button>
</body>
</html>
